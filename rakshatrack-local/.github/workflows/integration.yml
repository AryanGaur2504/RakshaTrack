name: RakshaTrack Integration Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rakshatrack-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rakshatrack-local/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify tests
        run: npm test
      - name: Typecheck and compile app
        run: npm run build
