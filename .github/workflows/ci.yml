name: RakshaTrack CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rakshatrack-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rakshatrack-local/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  guardian:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Guardian dependencies
        run: npm install --no-audit --no-fund
      - name: Run Guardian integration tests
        run: npm test
      - name: Verify server and portal syntax
        run: |
          node --check server.mjs
          node --check app.js
          node --check sw.js
