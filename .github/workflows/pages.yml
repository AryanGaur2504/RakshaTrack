name: Deploy RakshaTrack to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rakshatrack-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: rakshatrack-local/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Configure Pages and resolve current site URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for configured Pages path
        run: npm run build:pages
        env:
          # GitHub Pages project URLs change when a repository is renamed.
          # '/' also handles a root custom domain without guessing the repo name.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rakshatrack-local/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
