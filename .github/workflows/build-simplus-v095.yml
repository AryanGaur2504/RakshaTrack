name: Build SIM+ Campus v0.9.5 Student Switch Fix APK
on:
  push:
    branches: [simplus-v095-switch-picker]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble SIM+ v0.7.3 base
        run: |
          base64 -d source.tar.xz.b64 | tar -xJf -
          cp -a v032_overlay/. .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for directory,prefix,count in [('v05_json','source_',4),('v06_json','batch_',2)]:
              for i in range(count):
                  for name,body in json.loads(Path(f'{directory}/{prefix}{i}.json').read_text()).items():
                      p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(body,encoding='utf-8')
          PY
          cp -a v06_overlay/. .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for i in range(5):
              for name,body in json.loads(Path(f'v07_json/source_{i}.json').read_text(encoding='utf-8')).items():
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(body,encoding='utf-8')
          PY
          cp -a v071_overlay/. .
          cp v071_roster_update/StudentRosterStore.java app/src/main/java/com/campus/simplus/StudentRosterStore.java
          python3 v071_patch_fixed.py
          cp -a v072_overlay/. .
          patch -p1 --batch < v072_patch.diff
          for p in v073_final/academic.diff v073_final/photo.diff v073_final/ui.diff; do echo >> "$p"; done
          patch -p1 --batch < v073_final/academic.diff
          patch -p1 --batch < v073_final/photo.diff
          patch -p1 --batch < v073_final/ui.diff
          cp v073_final/sim_fill.js app/src/main/assets/sim_fill.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name,body in json.loads(Path('v073_final/tests.json').read_text(encoding='utf-8')).items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(body,encoding='utf-8')
          PY
      - name: Apply complete v0.8.0 source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for n in range(1,6):
              parts=sorted(Path('v080_parts').glob(f'p{n:02}_*.txt'))
              assert parts, f'Missing patch {n}'
              body=b''.join(p.read_bytes() for p in parts)
              if n==2:
                  begin=body.index(b'--- a/app/src/main/assets/sim_fill.js\n')
                  end=body.index(b'--- /dev/null\n',begin)
                  body=body[:begin]+body[end:]
              out=Path(f'/tmp/patch_{n:02}.diff')
              out.write_bytes(body+(b'\n' if not body.endswith(b'\n') else b''))
              print(out.name, len(body), len(parts))
          PY
          patch -p1 --batch < v080_patch/patch_00.diff
          for i in 01 02 03 04 05; do patch -p1 --batch < /tmp/patch_${i}.diff; done
          cp v080_special/sim_fill.js app/src/main/assets/sim_fill.js
      - name: Apply v0.9.0 redesign and onboarding
        run: |
          cat v090_chunks/part_*.txt | base64 -d | tar -xJf -
          grep -F "versionName '0.9.0'" app/build.gradle
          test -s app/src/main/assets/result_bot.js
      - name: Apply AKTU One View outage handling
        run: |
          python3 v091/v091_native_patch.py
          python3 v091/v091_ui_patch.py
          grep -F 'https://oneview.aktu.ac.in/WebPages/aktu/OneView.aspx' app/src/main/java/com/campus/simplus/AcademicFeatures.java
          grep -F "versionName '0.9.1'" app/build.gradle
      - name: Apply direct authenticated results fetch
        run: |
          mkdir -p /tmp/v092
          cat v092_transfer/part*.txt | base64 -d | tar -xJf - -C /tmp/v092
          test -s /tmp/v092/source.diff
          patch -p1 --batch < /tmp/v092/source.diff
          cp /tmp/v092/sim_direct_fetch.js app/src/main/assets/sim_direct_fetch.js
          grep -F "versionName '0.9.2'" app/build.gradle
          node --check app/src/main/assets/sim_direct_fetch.js
      - name: Install extension-based AKTU capture, SIM fast path and subject bunker
        run: |
          mkdir -p /tmp/v093
          cat v093_payload/part_*.txt | base64 -d | tar -xJf - -C /tmp/v093
          test -s /tmp/v093/update.diff
          patch -p1 --batch < /tmp/v093/update.diff
          cp /tmp/v093/aktu_extension_capture.js app/src/main/assets/aktu_extension_capture.js
          grep -F "versionName '0.9.3'" app/build.gradle
          node --check app/src/main/assets/aktu_extension_capture.js
      - name: Apply exact user-supplied v0.9.3 source files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          from pathlib import Path
          import base64, brotli, io, tarfile
          encoded=Path("restore_input/v093_exact_overrides.br.b64").read_text().strip()
          payload=brotli.decompress(base64.b64decode(encoded,validate=True))
          allowed={"app/src/main/java/com/campus/simplus/LargeXlsxReader.java","tests/aktu-fill-regression.test.js","tests/exams.test.js"}
          with tarfile.open(fileobj=io.BytesIO(payload),mode="r:") as tf:
              members=tf.getmembers()
              assert set(m.name for m in members)==allowed
              for m in members:
                  assert m.isfile()
                  target=Path(m.name)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(tf.extractfile(m).read())
          for p in Path("app").rglob("*.orig"):
              p.unlink()
          print("Restored exact source overrides and removed patch backups")
          PY
      - name: Compare restored app with user's uploaded v0.9.3 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          paths=sorted([p for d in ("app","tests") for p in Path(d).rglob("*") if p.is_file()] + [Path(p) for p in ("build.gradle","gradle.properties","settings.gradle")])
          h=hashlib.sha256()
          for p in paths:
              h.update(p.as_posix().encode()+b'\0'+p.read_bytes()+b'\0')
          expected="d69fefb78691ccd7b0149990ada265aa0c9ae72021206496cbddd7cfdd09ec53"
          observed=h.hexdigest()
          print("Number of application and test files:",len(paths))
          print("Restored code fingerprint:",observed)
          print("User-uploaded source fingerprint:",expected)
          if observed != expected or len(paths)!=39:
              for p in paths:
                  print(hashlib.sha256(p.read_bytes()).hexdigest(),p)
              raise SystemExit("Source reconstruction differs from uploaded v0.9.3. Refusing to publish mismatched APK.")
          print("EXACT SOURCE MATCH VERIFIED")
          PY

      - name: Apply v0.9.4 selective-sync upgrade to verified original code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,brotli
          encoded=Path('restore_input/v094_patch.br.b64').read_text().strip()
          patch=brotli.decompress(base64.b64decode(encoded,validate=True))
          assert patch.startswith(b'--- a/app/build.gradle'), 'Unexpected patch source'
          # The rebuilt v0.9.3 source has a different non-runtime README;
          # keep application/code patch exact without depending on README context.
          begin=patch.index(b'--- a/README.md\n')
          end=patch.index(b'--- /dev/null\n',begin)
          patch=patch[:begin]+patch[end:]
          Path('/tmp/simplus-v094.patch').write_bytes(patch)
          print('v0.9.4 patch bytes:',len(patch))
          PY
          patch -p1 --batch < /tmp/simplus-v094.patch
          grep -F "versionName '0.9.4'" app/build.gradle
          node --check app/src/main/assets/app.js
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          paths=sorted([p for d in ('app','tests') for p in Path(d).rglob('*') if p.is_file()]+[Path(p) for p in ('build.gradle','gradle.properties','settings.gradle')])
          h=hashlib.sha256()
          for p in paths:
              h.update(p.as_posix().encode()+b'\0'+p.read_bytes()+b'\0')
          actual=h.hexdigest()
          expected='070988620d7598197447ac2e144a5479e427a91b93e3b13e7164415efa3d1661'
          assert len(paths)==40 and actual==expected,(len(paths),actual,expected)
          print('Verified v0.9.4 full source fingerprint:',actual)
          PY
      - name: Apply v0.9.5 foreground switch-student picker and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,brotli,hashlib
          encoded=Path('restore_input/v095_switch_fix.br.b64').read_text().strip()
          raw=brotli.decompress(base64.b64decode(encoded,validate=True))
          actual=hashlib.sha256(raw).hexdigest()
          expected='68a79ab51aae245554af7fba33e47307b72ca2139e07749612a718008451d8b6'
          assert actual==expected,(actual,expected)
          assert raw.startswith(b'--- a/app/build.gradle\\n'), 'Unexpected patch file'
          Path('/tmp/simplus-v095-switch.patch').write_bytes(raw)
          print('Verified v0.9.5 patch sha256:',actual)
          PY
          patch -p1 --batch < /tmp/simplus-v095-switch.patch
          grep -F "versionName '0.9.5'" app/build.gradle
          grep -F "versionCode 19" app/build.gradle
          node --check app/src/main/assets/app.js
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          paths=sorted([p for d in ('app','tests') for p in Path(d).rglob('*') if p.is_file()]+[Path(p) for p in ('build.gradle','gradle.properties','settings.gradle')])
          h=hashlib.sha256()
          for p in paths:
              h.update(p.as_posix().encode()+b'\0'+p.read_bytes()+b'\0')
          actual=h.hexdigest()
          expected='5ca536431e5cf23c6d54966919f8be00dda3d712c85a9308431e57e7158f13dc'
          assert len(paths)==41 and actual==expected,(len(paths),actual,expected)
          print('Verified v0.9.5 app/test source fingerprint:',actual)
          PY
      - name: Run JavaScript tests
        run: |
          for f in app/src/main/assets/*.js; do node --check "$f"; done
          for f in tests/*.js; do node "$f"; done
      - name: Compile Android APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMPlus-Campus-v0.9.5-SwitchFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish restored APK as direct GitHub Release download
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          gh release create "simplus-v0.9.5" "$APK#SIMPlus_Campus_v0.9.5.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SIM+ Campus v0.9.5 — Student Switch Fix" \
            --notes "Restored SIM+ Campus base plus v0.9.4 selective sync and v0.9.5 fix: Switch Student opens a visible searchable picker from any scroll position; A to B to A preserves the primary profile attendance and results without a resync. Verified JavaScript regression tests and source fingerprints. Debug build; preserve local data before uninstalling previous versions." \
            --prerelease
