name: Build SIM+ Android APK
on:
  push:
    branches: [simplus-apk-build-20261102]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack original SIM+ source
        run: base64 -d source.tar.xz.b64 | tar -xJf -
      - name: Apply complete SIM+ v0.3.2 upgrade
        run: cp -a v032_overlay/. .
      - name: Verify source syntax and tests
        run: |
          node --check app/src/main/assets/engine.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/erp_bot.js
          node --check app/src/main/assets/exam_engine.js
          node --check app/src/main/assets/result_scan.js
          node --check app/src/main/assets/result_bot.js
          node tests/engine.test.js
          node tests/exams.test.js
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMPlus-Campus-v0.3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
