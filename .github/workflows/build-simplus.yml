name: Build SIM+ Android APK
on:
  push:
    branches: [simplus-apk-build-20261102]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack SIM+ source
        run: base64 -d source.tar.xz.b64 | tar -xJf -
      - name: Apply Java source compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/campus/simplus/AcademicFeatures.java")
          s=p.read_text().replace("    }\n    /** Trigger from a user tap. Finds actual semester/exam controls, never assumes result availability. */", "    /** Trigger from a user tap. Finds actual semester/exam controls, never assumes result availability. */")
          p.write_text(s)
          PY
      - name: Check JavaScript
        run: |
          node --check app/src/main/assets/engine.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/erp_bot.js
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIMPlus-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
