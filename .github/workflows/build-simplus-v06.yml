name: Build SIM+ Campus v0.6 Android
on:
  push:
    branches: [simplus-v060-android-build]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble all source revisions
        run: |
          base64 -d source.tar.xz.b64 | tar -xJf -
          cp -a v032_overlay/. .
          python3 - <<'PY'
          import json
          from pathlib import Path
          for directory,count in [('v05_json',4),('v06_json',2)]:
              for i in range(count):
                  for name,content in json.loads(Path(f'{directory}/'+('source_' if directory=='v05_json' else 'batch_')+f'{i}.json').read_text()).items():
                      target=Path(name)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_text(content,encoding='utf-8')
          PY
          cp -a v06_overlay/. .
      - name: Verify source and tests
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/aktu_fill.js
          node --check app/src/main/assets/result_scan.js
          node --check app/src/main/assets/result_bot.js
          node tests/engine.test.js
          node tests/exams.test.js
          node tests/semester-scan.test.js
          node tests/aktu-real-shape.test.js
          node tests/aktu-probe.test.js
          node tests/aktu-fill-regression.test.js
          node tests/sim-fingerprint.test.js
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SIMPlus-Campus-v0.6.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
