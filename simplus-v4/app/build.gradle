plugins { id 'com.android.application' }

android {
    namespace 'com.campus.simplus'
    compileSdk 35
    defaultConfig {
        applicationId 'com.campus.simplus'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.4.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}